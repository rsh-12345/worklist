.overdue-text { color: #cf1322; font-weight: 600; }

.done-section.collapsed .done-items { display: none; }
.done-section .done-label {

  margin-bottom: 4px;

  user-select: none;
  display: flex;
  align-items: center;
  gap: 4px;

.done-section .done-label:hover { color: #555; }
.done-section .done-label .caret {

.done-section:not(.collapsed) .done-label .caret { transform: rotate(90deg); }
.done-section .item {

.done-section .item-body .content {

  color: #999;
}
.done-section .item-body .meta-line {
  font-size: 11px;
  color: #bbb;

  display: flex;
  justify-content: center;

  flex-wrap: wrap;

.summary-item { font-size: 13px; color: #666; }
.summary-item strong { color: #333; }
.summary-item .red { color: #cf1322; }
.summary-item .orange { color: #d46b08; }
.summary-item .green { color: #389e0d; }
.done-toggle-bar { text-align: center; margin-bottom: 14px; }

#toggleAllDoneBtn:hover { border-color: #1890ff; color: #1890ff; }

.task-images { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.task-img {

.lightbox {

.lightbox.show { display: flex; }
.lightbox img { max-width: 94%; max-height: 94%; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,.4); }

const TODAY = "2026-07-29";
const COS_BASE = "https://worklist-1428384405.cos-website.ap-beijing.myqcloud.com";

function renderContent(raw) {
  if (!raw) return '';
  function escHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escAttr(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  const imgRegex = /【附图：([^】]*?)】/g;
  // 每次渲染生成唯一缓存键，彻底绕过浏览器对旧 404 的缓存
  const cacheBust = '?v=' + Date.now();
  let out = '';
  let last = 0;
  let m;
  while ((m = imgRegex.exec(raw)) !== null) {
    out += escHtml(raw.substring(last, m.index));
    const paths = m[1].split(/[；;]/).map(p => p.trim()).filter(Boolean);
    let imgs = '';
    paths.forEach(p => {
      // 同时兼容 F:/workbuddy/ 与 F:\workbuddy\，统一转成 URL 斜杠
      let relUrl = p.replace(/^F:[\\/]workbuddy[\\/]/i, '/').replace(/\\/g, '/');
      // 本地路径补全 COS 公网地址（云端注入前 publish_attachments 已改写为 URL，此行兜底）
      if (!/^https?:\/\//i.test(relUrl)) {
        relUrl = COS_BASE + relUrl;
      }
      const plainUrl = relUrl; // 无缓存键的绝对地址
      const url = plainUrl + cacheBust;
      const safe = plainUrl.replace(/'/g, "\\'");
      imgs += '<img class="task-img" src="' + escAttr(url) + '" data-plain="' + escAttr(plainUrl) + '" onclick="openLightbox(\'' + safe + '\')" alt="附图" loading="lazy" onerror="retryImg(this)">';
      imgs += '<span class="img-fallback" style="display:none">图片加载失败：<a href="' + escAttr(plainUrl) + '" target="_blank" onclick="event.stopPropagation()">' + escHtml(plainUrl.replace(COS_BASE, '')) + '</a></span>';
    });
    if (imgs) out += '<div class="task-images">' + imgs + '</div>';
    last = imgRegex.lastIndex;
  }
  out += escHtml(raw.substring(last));
  return out;
}

function retryImg(img) {
  if (img.dataset.retried) {
    img.classList.add('img-error');
    img.style.display = 'none';
    if (img.nextElementSibling) img.nextElementSibling.style.display = 'inline-flex';
    return;
  }
  img.dataset.retried = '1';
  var plain = img.dataset.plain;
  if (plain && plain !== img.src.split('?')[0]) {
    img.src = plain + '?retry=' + Date.now();
  } else {
    img.classList.add('img-error');
    img.style.display = 'none';
    if (img.nextElementSibling) img.nextElementSibling.style.display = 'inline-flex';
  }
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('show');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lightbox-img').src = '';
}

function parseDate(s) {
  if (!s) return null;
  const parts = s.split('-');
  return new Date(+parts[0], +parts[1] - 1, +parts[2]);
}

function isOverdue(dl) {
  if (!dl) return false;
  const d = parseDate(dl);
  if (!d) return false;
  return d < parseDate(TODAY);
}

function isToday(dl) {
  return dl && dl === TODAY;
}

function isTomorrow(dl) {
  if (!dl) return false;
  const t = parseDate(TODAY);
  if (!t) return false;
  t.setDate(t.getDate() + 1);
  const y = t.getFullYear();
  const m = String(t.getMonth() + 1).padStart(2, '0');
  const d = String(t.getDate()).padStart(2, '0');
  return dl === y + '-' + m + '-' + d;
}

function fmtDate(dl) {
  return dl ? dl.replace(/-/g, '/') : '';
}

function fmtCompleted(iso) {
  if (!iso) return '';
  const d = iso.split('T')[0];
  const t = iso.split('T')[1].split('.')[0];
  return d.replace(/-/g, '/') + ' ' + t.substring(0,5);
}

function render() {
  // Group by project
  const projects = {};
  DATA.forEach(item => {
    if (!projects[item.project_name]) {
      projects[item.project_name] = { active: [], done: [] };
    }
    if (item.status === 'completed') {
      projects[item.project_name].done.push(item);
    } else {
      projects[item.project_name].active.push(item);
    }
  });

  // Sort projects: most active items first
  const projNames = Object.keys(projects).sort((a, b) => {
    return projects[b].active.length - projects[a].active.length;
  });

  // Summary
  const total = DATA.length;
  const done = DATA.filter(i => i.status === 'completed').length;
  const active = total - done;
  const overdue = DATA.filter(i => i.status !== 'completed' && isOverdue(i.deadline)).length;
  const dueToday = DATA.filter(i => i.status !== 'completed' && isToday(i.deadline)).length;

  document.getElementById('summary').innerHTML =
    `<div class="summary-item">总计 <strong>${total}</strong> 项</div>` +
    `<div class="summary-item">待处理 <strong class="orange">${active}</strong></div>` +
    `<div class="summary-item">已逾期 <strong class="red">${overdue}</strong></div>` +
    `<div class="summary-item">今日到期 <strong class="orange">${dueToday}</strong></div>` +
    `<div class="summary-item">已完成 <strong class="green">${done}</strong></div>`;

  document.getElementById('meta').innerHTML = `<span>${projNames.length} 个项目</span>`;

  // 显示构建时间作为更新时间
  document.getElementById('updated').textContent =
    '数据更新于 ' + BUILD_TIME.replace(/-/g, '/').substring(0, 16);

  let html = '';
  projNames.forEach(name => {
    const p = projects[name];
    const urgentCount = p.active.filter(i => i.priority === 'urgent').length;
    const overdueCount = p.active.filter(i => isOverdue(i.deadline)).length;
    const doneCount = p.done.length;

    let badges = '';
    if (overdueCount > 0) badges += `<span class="badge badge-overdue">逾期 ${overdueCount}</span>`;
    if (urgentCount > 0) badges += `<span class="badge badge-urgent">紧急 ${urgentCount}</span>`;
    if (doneCount > 0) badges += `<span class="badge badge-done">已完成 ${doneCount}</span>`;

    html += `<div class="card">`;
    html += `<div class="card-header"><h2>${name}</h2><div class="badges">${badges}</div></div>`;
    html += `<div class="item-list">`;

    if (p.active.length === 0) {
      html += `<div class="empty">暂无待处理事项</div>`;
    } else {
      // Sort active: urgent first, then by deadline
      const sorted = [...p.active].sort((a, b) => {
        if (a.priority === 'urgent' && b.priority !== 'urgent') return -1;
        if (b.priority === 'urgent' && a.priority !== 'urgent') return 1;
        return (a.deadline || '9999').localeCompare(b.deadline || '9999');
      });

      sorted.forEach(item => {
        const cls = item.status === 'in_progress' ? 'in_progress' : '';
        const dotCls = item.status === 'in_progress' ? 'in_progress' : 'pending';
        let dlText = '';
        let dlClass = '';
        if (!item.deadline) {
          dlText = '';
          dlClass = '';
        } else if (isOverdue(item.deadline)) {
          const days = Math.floor((parseDate(TODAY) - parseDate(item.deadline)) / (1000*60*60*24));
          dlText = '已逾期 ' + days + ' 天';
          dlClass = 'overdue-text';
        } else if (isToday(item.deadline)) {
          dlText = '今天截止';
          dlClass = 'due-today-text';
        } else if (isTomorrow(item.deadline)) {
          dlText = '明天截止';
        } else {
          dlText = fmtDate(item.deadline) + ' 截止';
        }

        const prioTag = item.priority === 'urgent'
          ? '<span class="tag" style="color:#cf1322">⚡紧急</span>' : '';

        html += `<div class="item ${cls}">`;
        html += `<div class="status-dot ${dotCls}"></div>`;
        html += `<div class="item-body">`;
        html += `<div class="content">${renderContent(item.content)}</div>`;
        html += `<div class="meta-line">${prioTag}${dlText ? `<span class="tag ${dlClass}">📅 ${dlText}</span>` : ''}</div>`;
        html += `</div></div>`;
      });
    }

    html += `</div>`;

    // Done section (默认折叠)
    if (p.done.length > 0) {
      html += `<div class="done-section collapsed">`;
      html += `<div class="done-label" data-toggle>✅ 已完成 (${p.done.length}) <span class="caret">▶</span></div>`;
      html += `<div class="done-items">`;
      p.done.forEach(item => {
        html += `<div class="item">`;
        html += `<div class="status-dot completed"></div>`;
        html += `<div class="item-body">`;
        html += `<div class="content">${renderContent(item.content)}</div>`;
        html += `<div class="meta-line">完成于 ${fmtCompleted(item.completed_at)}</div>`;
        html += `</div></div>`;
      });
      html += `</div></div>`;
    }

    html += `</div>`;
  });

  document.getElementById('grid').innerHTML = html;
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

render();

function bindDoneToggle() {
  const grid = document.getElementById('grid');
  // 事件委托：点击项目卡内的「已完成」标题，展开/收起该项
  grid.addEventListener('click', function(e) {
    const lbl = e.target.closest('[data-toggle]');
    if (lbl) { lbl.parentElement.classList.toggle('collapsed'); }
  });
  // 全局开关：展开/收起所有项目的已完成
  const btn = document.getElementById('toggleAllDoneBtn');
  if (btn) {
    btn.addEventListener('click', function() {
      const sections = document.querySelectorAll('.done-section');
      const anyCollapsed = Array.prototype.some.call(sections, function(s) {
        return s.classList.contains('collapsed');
      });
      sections.forEach(function(s) { s.classList.toggle('collapsed', !anyCollapsed); });
      btn.textContent = anyCollapsed ? '收起全部已完成' : '展开全部已完成';
    });
  }
}
bindDoneToggle();
} // end initApp
</script>
</body>
</html>
